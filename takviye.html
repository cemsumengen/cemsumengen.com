<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem("takviye-tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>Takviye takibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#1B2A2F; --muted:#5C6B6F; --line:#D5DEDC; --zebra:#F5F8F7;
  --teal:#1F7A6D; --teal-soft:#DCEFEB; --dawn:#D8952B; --noon:#2F8F5B; --dusk:#4A4E9C; --warn:#B4532A; --box:#7A918D; --on-teal:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --surface:#1A2326; --ink:#E6EEEC; --muted:#93A3A6; --line:#2B373A; --zebra:#1F292C;
    --teal:#4FBFAE; --teal-soft:#1D3633; --dawn:#E9AF55; --noon:#5CC08A; --dusk:#8E92E6; --warn:#E58A5F; --box:#7D9498; --on-teal:#0E1B1D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#1A2326; --ink:#E6EEEC; --muted:#93A3A6; --line:#2B373A; --zebra:#1F292C;
  --teal:#4FBFAE; --teal-soft:#1D3633; --dawn:#E9AF55; --noon:#5CC08A; --dusk:#8E92E6; --warn:#E58A5F; --box:#7D9498; --on-teal:#0E1B1D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:14px 10px 28px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font:700 22px/1.1 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.sync{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 0;cursor:pointer;white-space:nowrap}
.sync.ok{color:var(--teal)} .sync.err{color:var(--warn)}
.topr{display:flex;align-items:center;gap:8px}
.theme{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:600;font-size:15px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal-soft);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.weeknav .mid{text-align:center}
.weeknav b{display:block;font-size:15px}
.navbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.linkbtn{border:0;background:none;color:var(--teal);font-size:12px;font-weight:600;padding:2px 4px;cursor:pointer}
.linkbtn[hidden]{display:none}

.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.name{width:36%}
th,td{padding:6px 1px;text-align:center;vertical-align:middle}
thead th{font-weight:600;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);line-height:1.2}
thead th b{display:block;font-size:14px;color:var(--ink)}
thead th.today{color:var(--teal)} thead th.today b{color:var(--teal)}
thead th:first-child,tbody th{text-align:left;padding-left:8px}
tbody tr:nth-child(even){background:var(--zebra)}
tbody th{font-weight:400;border-left:3px solid var(--c)}
tbody th b{display:block;font-weight:600;font-size:13px;line-height:1.25}
tbody th small{display:block;font-size:11px;color:var(--c);line-height:1.25}
td.todaycol{background:color-mix(in srgb,var(--teal) 8%,transparent)}
.cb{width:28px;height:28px;border-radius:8px;border:2px solid var(--box);background:var(--surface);display:inline-grid;place-items:center;padding:0;cursor:pointer;position:relative;vertical-align:middle}
.cb svg{width:15px;height:15px;opacity:0}
.cb[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.cb[aria-pressed="true"] svg{opacity:1}
.cb.opt{border-style:dashed}
.cb:disabled{opacity:.35;cursor:default}
.cb .dz{position:absolute;bottom:-12px;left:0;right:0;font-size:10px;font-weight:600;color:var(--muted)}
tr.dose td{padding-bottom:14px}
.off{color:var(--line)}
tfoot td{font-size:11px;color:var(--muted);border-top:1px solid var(--line);font-variant-numeric:tabular-nums;padding:6px 1px}
tfoot td.full{color:var(--teal);font-weight:600}
.legend{color:var(--muted);font-size:12px;margin:8px 2px 0}
/* takip tablosu */
.tw{--nm:118px;--day:max(58px,calc((min(100vw,560px) - 22px - var(--nm)) / 7));overscroll-behavior-x:contain;scroll-behavior:smooth}
#grid{width:calc(var(--nm) + var(--day) * 7)}
#grid col.name{width:var(--nm)} #grid col.d{width:var(--day)}
#grid th:first-child,#grid tbody th,#grid tfoot td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
#grid tbody tr:nth-child(even) th{background:var(--zebra)}
#grid td{padding:8px 2px}
#grid .cb{width:44px;height:44px;border-radius:12px}
#grid .cb svg{width:22px;height:22px}
#grid tr.dose td{padding-bottom:18px}
#grid .cb .dz{bottom:-17px;font-size:11px}
#grid thead th{font-size:12px} #grid thead th b{font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card b{font-size:14px}
.dosepanel{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.dosepanel label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.dosepanel input[type=date]{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.chips{display:flex;gap:6px;margin:8px 0}
.chip{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:600;cursor:pointer}
.chip:active{background:var(--teal-soft)}
.steps{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
.steps li{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.steps button{border:0;background:none;color:var(--warn);font-size:12px;cursor:pointer}

.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c)}
.ring{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.notes{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.notes h2{font:700 15px/1.2 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0 0 6px}
.notes ul{margin:0;padding-left:16px;color:var(--muted);font-size:13px}
.notes li{margin-bottom:3px}
.notes strong{color:var(--ink);font-weight:600}

.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:20}
.gate[hidden]{display:none}
.gate .panel{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.gate h2{font:700 20px/1.2 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0 0 6px}
.gate p{color:var(--muted);margin:0 0 12px}
.gate input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gate .err{color:var(--warn);font-size:13px;margin:8px 0 0}
.primary{width:100%;margin-top:12px;border:0;background:var(--teal);color:var(--on-teal);border-radius:12px;padding:12px;font-weight:600;font-size:15px;cursor:pointer}
.primary:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:90vw}
.toast[hidden]{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Takviye takibi</h1><div class="topr"><button class="sync" id="sync" type="button"></button><button class="theme" id="themeBtn" type="button" aria-label="Açık/koyu tema"></button></div></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-who="aygul" id="tab-aygul">Aygül</button>
    <button role="tab" data-who="arda" id="tab-arda">Arda</button>
  </div>
  <div class="seg">
    <button data-view="takip" type="button">Takip</button>
    <button data-view="program" type="button">Program</button>
  </div>

  <section id="vTakip">
    <div class="card" id="doseCard" hidden>
      <div class="row"><span>Microfer bugün: <b id="doseToday"></b></span><button class="linkbtn" id="doseToggle" type="button">Doz değiştir</button></div>
      <div class="dosepanel" id="dosePanel" hidden>
        <label for="doseDate">Bu tarihten itibaren</label>
        <input type="date" id="doseDate">
        <div class="chips"><button class="chip" data-d="5" type="button">5 damla</button><button class="chip" data-d="10" type="button">10 damla</button><button class="chip" data-d="15" type="button">15 damla</button></div>
        <ul class="steps" id="doseSteps"></ul>
      </div>
    </div>
    <div class="weeknav">
      <button class="navbtn" id="prev" type="button" aria-label="Önceki hafta">‹</button>
      <div class="mid"><b id="wkLabel"></b><button class="linkbtn" id="thisWeek" type="button">Bu haftaya dön</button></div>
      <button class="navbtn" id="next" type="button" aria-label="Sonraki hafta">›</button>
    </div>
    <div class="wrap tw" id="gridWrap"><table id="grid"></table></div>
    <p class="legend">Diğer günleri görmek için tabloyu yana kaydırın. Kesikli kutu: opsiyonel, sayıma dahil değil. İleri tarihli günler işaretlenemez.</p>
  </section>

  <section id="vProgram" hidden></section>
</main>

<div class="gate" id="gate" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <h2 id="gateTitle">Giriş</h2>
    <p>Adınızı ve soyadınızı yazın. Bu cihazda hatırlanır.</p>
    <input type="text" id="gateName" autocomplete="name" autocapitalize="words" spellcheck="false" placeholder="Ad Soyad" aria-label="Ad Soyad">
    <p class="err" id="gateErr" hidden></p>
    <button class="primary" id="gateGo" type="button">Giriş yap</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var SLOT={
  sabah:{c:"var(--dawn)"}, kahvalti:{c:"var(--dawn)"}, ogle:{c:"var(--noon)"}, aksam:{c:"var(--dusk)"}, yatmadan:{c:"var(--dusk)"}
};
var PEOPLE={
  aygul:{label:"Aygül", items:[
    {id:"sinfer",  name:"Sinfer saşe",    when:"Uyanınca, kahvaltıdan 1 sa önce", slot:"sabah"},
    {id:"biotin",  name:"Biotin",         when:"Kahvaltı",            slot:"kahvalti", days:[0,2,4], opt:true},
    {id:"elenatal",name:"Elenatal 3",     when:"Öğle yemeği",         slot:"ogle"},
    {id:"d3k2",    name:"D3K2 sprey",     when:"Öğle yemeği",         slot:"ogle"},
    {id:"telavium",name:"Telavium",       when:"Öğle yemeği",         slot:"ogle"},
    {id:"osteo",   name:"Osteocare Bone", when:"Akşam yemeği",        slot:"aksam"},
    {id:"mag4ca",  name:"Mag4 Kalsiyum",  when:"Yatmadan",            slot:"yatmadan", days:[1,3,5], opt:true}
  ], rules:[
    "Sinfer’den <strong>1 saat sonrasına</strong> kadar süt ürünü, çay, kahve ve kalsiyum yok.",
    "Kalsiyum (Osteocare, Mag4) demirden <strong>en az 2 saat</strong> ayrı.",
    "Elenatal 3 ve D3K2’yi <strong>yağlı öğünle</strong> al. Dozlar etikete göre.",
    "Boş daire: <strong>opsiyonel</strong>. Biotini kan tahlilinden 2–3 gün önce bırak.",
    "D vitamini birden fazla üründe var: toplam dozu doktora veya eczacıya kontrol ettir."
  ]},
  arda:{label:"Arda", items:[
    {id:"dvit",    name:"D vitamini sprey", when:"Sabah",                    slot:"sabah"},
    {id:"microfer",name:"Ocean Microfer",   when:"Öğle, iki beslenme arası", slot:"ogle", dose:true},
    {id:"kaleidon",name:"Kaleidon damla",   when:"Akşam",                    slot:"aksam"}
  ], rules:[
    "Saatler öneri. Doktorunuz farklı bir saat söylediyse onu kullanın.",
    "D vitamini ve Kaleidon dozu <strong>etikete ve doktor talimatına</strong> göre.",
    "Microfer dozu (5 → 10 → 15 damla) Takip ekranındaki “Doz değiştir” ile güncellenir.",
    "Demir damlası dışkı rengini koyulaştırabilir; bu genelde normaldir."
  ]}
};
var DAYS=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
var MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var CHECK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- tarih yardımcıları ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function todayDate(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function mondayOf(d){return addDays(d,-((d.getDay()+6)%7));}
function validDate(s){return typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function fmtDate(s){var p=s.split("-");return Number(p[2])+" "+MONTHS[Number(p[1])-1]+" "+p[0];}

/* ---------- veri ---------- */
var NAME_KEY="takviye-ad", CACHE_KEY="takviye-cache-v1", PEND_KEY="takviye-bekleyen-v1";
function emptyState(){return {rev:0,checks:{aygul:{},arda:{}},microfer:[]};}
function normalize(s){
  if(!s||typeof s!=="object") s=emptyState();
  if(!s.checks||typeof s.checks!=="object") s.checks={};
  Object.keys(PEOPLE).forEach(function(w){ if(!s.checks[w]||typeof s.checks[w]!=="object") s.checks[w]={}; });
  if(!Array.isArray(s.microfer)) s.microfer=[];
  return s;
}
function hasItem(who,id){return !!PEOPLE[who]&&PEOPLE[who].items.some(function(it){return it.id===id;});}
function applyOp(S,op){ // sunucudaki applyOp ile aynı
  if(!op||typeof op!=="object") return;
  if(op.t==="check"){
    if(!hasItem(op.who,op.id)||!validDate(op.date)) return;
    var box=S.checks[op.who];
    if(op.val){(box[op.date]||(box[op.date]={}))[op.id]=true;}
    else if(box[op.date]){delete box[op.date][op.id]; if(!Object.keys(box[op.date]).length) delete box[op.date];}
  } else if(op.t==="dose"){
    if(!validDate(op.from)) return;
    S.microfer=S.microfer.filter(function(x){return x.from!==op.from;});
    if(Number.isInteger(op.drops)&&op.drops>=1&&op.drops<=60) S.microfer.push({from:op.from,drops:op.drops});
    S.microfer.sort(function(a,b){return a.from<b.from?-1:1;});
  }
}
function doseOn(date){var d=null;st.microfer.forEach(function(x){if(x.from<=date)d=x.drops;});return d;}

var st=emptyState(), name=null, pending=[], inflight=false, sendT=null, lastRev=-1;
try{
  name=localStorage.getItem(NAME_KEY);
  var c=localStorage.getItem(CACHE_KEY); if(c) st=JSON.parse(c);
  pending=JSON.parse(localStorage.getItem(PEND_KEY)||"[]"); if(!Array.isArray(pending)) pending=[];
}catch(e){pending=[];}
st=normalize(st);
function saveLocal(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(st));localStorage.setItem(PEND_KEY,JSON.stringify(pending));}catch(e){}}

/* ---------- sunucu ---------- */
function api(method,body){
  return fetch("/api/takviye",{method:method,cache:"no-store",
    headers:{"content-type":"application/json","x-takviye-ad":encodeURIComponent(name||"")},
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    if(r.status===403){var e=new Error("auth");e.auth=true;throw e;}
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  });
}
function adopt(srv){
  lastRev=srv.rev||0; st=normalize(srv);
  pending.forEach(function(op){applyOp(st,op);});
  saveLocal(); render();
}
function commit(op){
  applyOp(st,op); pending.push(op); saveLocal(); render(); setStatus("saving");
  clearTimeout(sendT); sendT=setTimeout(flush,300);
}
function flush(){
  if(!name||inflight||!pending.length) return Promise.resolve();
  inflight=true; var batch=pending.slice(); setStatus("saving");
  return api("POST",{ops:batch}).then(function(srv){
    pending=pending.slice(batch.length); inflight=false; adopt(srv);
    setStatus(pending.length?"saving":"ok");
    if(pending.length){clearTimeout(sendT);sendT=setTimeout(flush,200);}
  }).catch(function(e){
    inflight=false;
    if(e.auth){logout("Oturum doğrulanamadı. Lütfen tekrar giriş yapın.");return;}
    setStatus("err"); clearTimeout(sendT); sendT=setTimeout(flush,15000);
  });
}
function pull(){
  if(!name||inflight) return Promise.resolve();
  if(pending.length) return flush();
  return api("GET").then(function(srv){
    setStatus("ok");
    if((srv.rev||0)!==lastRev&&!inflight&&!pending.length) adopt(srv);
  }).catch(function(e){
    if(e.auth){logout("Oturum doğrulanamadı. Lütfen tekrar giriş yapın.");return;}
    setStatus("err");
  });
}
function setStatus(x){
  var el=$("sync"); el.className="sync "+(x==="ok"?"ok":x==="err"?"err":"");
  el.textContent=x==="ok"?"● Eşitlendi":x==="err"?"Bağlantı yok, tekrar denenecek":x==="saving"?"Kaydediliyor…":"";
}

/* ---------- giriş ---------- */
function showGate(msg){
  $("gateErr").textContent=msg||""; $("gateErr").hidden=!msg; $("gate").hidden=false;
  setTimeout(function(){$("gateName").focus();},50);
}
function logout(msg){
  name=null; try{localStorage.removeItem(NAME_KEY);}catch(e){}
  setStatus(""); showGate(msg);
}
function login(){
  var v=$("gateName").value.trim();
  if(!v){showGate("Ad ve soyad yazın.");return;}
  name=v; $("gateGo").disabled=true;
  api("GET").then(function(srv){
    try{localStorage.setItem(NAME_KEY,v);}catch(e){}
    $("gate").hidden=true; $("gateGo").disabled=false;
    setStatus("ok"); adopt(srv);
    if(pending.length) flush();
  }).catch(function(e){
    name=null; $("gateGo").disabled=false;
    showGate(e.auth?"Bu isimle giriş yapılamıyor.":"Sunucuya ulaşılamadı. Sayfayı Netlify adresinizden açtığınızdan emin olun.");
  });
}
$("gateGo").addEventListener("click",login);
$("gateName").addEventListener("keydown",function(e){if(e.key==="Enter")login();});

/* ---------- görünüm durumu ---------- */
var who="aygul", view="takip", weekStart=mondayOf(todayDate()), focusToday=true;
function readHash(){
  var h=(location.hash||"").slice(1).split("-");
  who=PEOPLE[h[0]]?h[0]:"aygul";
  view=h[1]==="program"?"program":"takip";
}
function writeHash(){
  var h="#"+who+(view==="program"?"-program":"");
  if(location.hash!==h) history.replaceState(null,"",h);
}
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click",function(){who=b.dataset.who;focusToday=true;writeHash();render();});
});
document.querySelectorAll(".seg button").forEach(function(b){
  b.addEventListener("click",function(){view=b.dataset.view;focusToday=true;writeHash();render();});
});
window.addEventListener("hashchange",function(){readHash();focusToday=true;render();});
$("prev").addEventListener("click",function(){weekStart=addDays(weekStart,-7);focusToday=true;render();});
$("next").addEventListener("click",function(){weekStart=addDays(weekStart,7);focusToday=true;render();});
$("thisWeek").addEventListener("click",function(){weekStart=mondayOf(todayDate());focusToday=true;render();});

/* ---------- Microfer dozu ---------- */
$("doseToggle").addEventListener("click",function(){
  var p=$("dosePanel"); p.hidden=!p.hidden;
  if(!p.hidden&&!$("doseDate").value) $("doseDate").value=iso(todayDate());
});
document.querySelectorAll(".chip").forEach(function(b){
  b.addEventListener("click",function(){
    var f=$("doseDate").value||iso(todayDate());
    if(!validDate(f)) return;
    commit({t:"dose",from:f,drops:Number(b.dataset.d)});
    toast(fmtDate(f)+" itibarıyla "+b.dataset.d+" damla");
  });
});
$("doseSteps").addEventListener("click",function(e){
  var b=e.target.closest("button[data-from]"); if(!b) return;
  if(confirm(fmtDate(b.dataset.from)+" tarihli doz adımı silinsin mi?")) commit({t:"dose",from:b.dataset.from,drops:null});
});

/* ---------- çizim ---------- */
function scheduled(it,dayIdx){return !it.days||it.days.indexOf(dayIdx)>-1;}
function render(){
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.who===who?"true":"false");});
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.view===view?"true":"false");});
  $("vTakip").hidden=view!=="takip"; $("vProgram").hidden=view!=="program";
  if(view==="takip") renderTakip(); else renderProgram();
}
function renderTakip(){
  var P=PEOPLE[who], today=iso(todayDate()), dates=[];
  for(var i=0;i<7;i++) dates.push(iso(addDays(weekStart,i)));
  var end=addDays(weekStart,6), a=weekStart;
  $("wkLabel").textContent=(a.getMonth()===end.getMonth()?a.getDate():a.getDate()+" "+MONTHS[a.getMonth()])+"–"+end.getDate()+" "+MONTHS[end.getMonth()]+" "+end.getFullYear();
  $("thisWeek").hidden=iso(weekStart)===iso(mondayOf(todayDate()));

  // doz kartı
  $("doseCard").hidden=who!=="arda";
  if(who==="arda"){
    var dt=doseOn(today);
    $("doseToday").textContent=dt?dt+" damla":"henüz girilmedi";
    $("doseSteps").innerHTML=st.microfer.length?st.microfer.map(function(x){
      return '<li><span>'+fmtDate(x.from)+' → <b>'+x.drops+' damla</b></span><button type="button" data-from="'+x.from+'">Sil</button></li>';
    }).join(""):'<li><span>Henüz doz adımı yok. Tarih seçip doza dokunun.</span></li>';
  }

  var box=st.checks[who]||{}, h='<colgroup><col class="name">'+'<col class="d">'.repeat(7)+'</colgroup><thead><tr><th scope="col"></th>';
  dates.forEach(function(d,i){
    h+='<th scope="col"'+(d===today?' class="today"':'')+'>'+DAYS[i]+'<b>'+Number(d.slice(8))+'</b></th>';
  });
  h+='</tr></thead><tbody>';
  P.items.forEach(function(it){
    h+='<tr'+(it.dose?' class="dose"':'')+' style="--c:'+SLOT[it.slot].c+'"><th scope="row"><b>'+it.name+'</b><small>'+it.when+(it.opt?', opsiyonel':'')+'</small></th>';
    dates.forEach(function(d,i){
      var cls=d===today?' class="todaycol"':'';
      if(!scheduled(it,i)){h+='<td'+cls+'><span class="off">–</span></td>';return;}
      var on=!!(box[d]&&box[d][it.id]), fut=d>today, dz='';
      if(it.dose){var x=doseOn(d); dz='<span class="dz">'+(x?x+' dml':'?')+'</span>';}
      h+='<td'+cls+'><button type="button" class="cb'+(it.opt?' opt':'')+'" data-id="'+it.id+'" data-date="'+d+'" aria-pressed="'+on+'"'+(fut?' disabled':'')+
        ' aria-label="'+it.name+', '+fmtDate(d)+'">'+CHECK+dz+'</button></td>';
    });
    h+='</tr>';
  });
  h+='</tbody><tfoot><tr><td></td>';
  dates.forEach(function(d,i){
    var req=P.items.filter(function(it){return !it.opt&&scheduled(it,i);});
    var done=req.filter(function(it){return box[d]&&box[d][it.id];}).length;
    var full=done===req.length&&req.length>0;
    h+='<td class="'+(full?'full':'')+(d===today?' todaycol':'')+'">'+(d>today?'':full?'✓':done+'/'+req.length)+'</td>';
  });
  h+='</tr></tfoot>';
  var gw=$("gridWrap"), keep=gw.scrollLeft;
  $("grid").innerHTML=h;
  if(focusToday){
    focusToday=false;
    var tIdx=dates.indexOf(today), th=tIdx>-1?$("grid").querySelectorAll("thead th")[tIdx+1]:null;
    gw.style.scrollBehavior="auto";
    if(th){var nm=$("grid").querySelector("tbody th");gw.scrollLeft=Math.max(0,th.offsetLeft-(nm?nm.offsetWidth:0)-(tIdx>0?th.offsetWidth:0));}
    else gw.scrollLeft=0;
    gw.style.scrollBehavior="";
  } else gw.scrollLeft=keep;
}
$("grid").addEventListener("click",function(e){
  var b=e.target.closest(".cb"); if(!b||b.disabled) return;
  commit({t:"check",who:who,date:b.dataset.date,id:b.dataset.id,val:b.getAttribute("aria-pressed")!=="true"});
});
function renderProgram(){
  var P=PEOPLE[who], h='<div class="wrap"><table><colgroup><col class="name">'+'<col>'.repeat(7)+'</colgroup><thead><tr><th scope="col">Ne / ne zaman</th>';
  DAYS.forEach(function(d){h+='<th scope="col">'+d+'</th>';});
  h+='</tr></thead><tbody>';
  P.items.forEach(function(it){
    h+='<tr style="--c:'+SLOT[it.slot].c+'"><th scope="row"><b>'+it.name+'</b><small>'+it.when+(it.opt?', opsiyonel':'')+'</small></th>';
    for(var i=0;i<7;i++) h+=scheduled(it,i)?'<td><span class="'+(it.opt?'ring':'dot')+'"></span></td>':'<td class="off">–</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(who==="arda"){
    var dt=doseOn(iso(todayDate()));
    h+='<div class="notes"><h2>Microfer dozu</h2><ul><li>Bugün: <strong>'+(dt?dt+' damla':'henüz girilmedi')+'</strong></li>'+
      st.microfer.map(function(x){return '<li>'+fmtDate(x.from)+' itibarıyla '+x.drops+' damla</li>';}).join("")+'</ul></div>';
  }
  h+='<div class="notes"><h2>Kurallar</h2><ul>'+P.rules.map(function(r){return '<li>'+r+'</li>';}).join("")+'</ul></div>';
  $("vProgram").innerHTML=h;
}

var toastT=null;
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2200);}

/* ---------- eşitleme döngüsü ---------- */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible") pull();
  else if(pending.length&&name){
    try{fetch("/api/takviye",{method:"POST",keepalive:true,headers:{"content-type":"application/json","x-takviye-ad":encodeURIComponent(name)},body:JSON.stringify({ops:pending})});}catch(e){}
  }
});
setInterval(function(){if(document.visibilityState==="visible")pull();},30000);
// Gece yarısı geçince "bugün" vurgusunu güncelle
var lastDay=iso(todayDate());
setInterval(function(){var d=iso(todayDate());if(d!==lastDay){lastDay=d;weekStart=mondayOf(todayDate());focusToday=true;render();}},60000);

function isDark(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;}
function paintTheme(){var d=isDark();$("themeBtn").textContent=d?"☀":"☾";$("themeBtn").setAttribute("aria-label",d?"Açık temaya geç":"Koyu temaya geç");}
$("themeBtn").addEventListener("click",function(){
  var t=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("takviye-tema",t);}catch(e){}paintTheme();
});
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintTheme);}catch(e){}
paintTheme();
readHash(); writeHash(); render();
if(name){setStatus("saving");pull();} else showGate();
})();
</script>
</body>
</html>
